[package]
name = "rune-suite"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "What the Rune apps share: their look, fields and controls, the keyring, settings files, accounts, contacts and links between apps."

[dependencies]
# Same rev as every app, so the workspace builds Rune once.
rune = { git = "https://github.com/anomalyco/rune", rev = "f022a27c04013abbda6771b08bfc61fad7529111" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
keyring = "4"
ureq = "2"
base64 = "0.22"
roxmltree = "0.20"
url = "2"
