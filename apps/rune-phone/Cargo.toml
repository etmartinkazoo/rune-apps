[package]
name = "rune-phone"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Rune has no releases yet; apps pin a `dev` rev (see Rune's AGENTS.md). Same rev as Rune Mail.
rune = { git = "https://github.com/anomalyco/rune", rev = "f022a27c04013abbda6771b08bfc61fad7529111" }
# D-Bus, pure Rust: BlueZ (pairing, the phone's link), obexd (messages and contacts over MAP and
# PBAP) and PipeWire's telephony service (calls over HFP).
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service", "object-manager"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "5"
base64 = "0.22"

# macOS: IOBluetooth for the link, and the main thread it has to be called from.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-io-bluetooth = "0.3"
dispatch2 = "0.3"
