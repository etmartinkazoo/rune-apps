[package]
name = "rune-notes"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Rune has no releases yet; apps pin a `dev` rev (see Rune's AGENTS.md). Same rev as Rune Mail
# and Rune Calendar.
rune = { git = "https://github.com/anomalyco/rune", rev = "f022a27c04013abbda6771b08bfc61fad7529111" }
# The rendered preview.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "f022a27c04013abbda6771b08bfc61fad7529111", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
